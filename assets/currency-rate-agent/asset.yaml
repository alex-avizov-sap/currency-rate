apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: currency-rate-agent
  version: 1.0.0

type: agent

container:
  buildPath: .
  port: 5000

agentCard:
  name: Currency Rate Agent
  version: 1.0.0
  description: Conversational AI agent that retrieves real-time currency exchange rates and converts amounts between currencies using natural language queries

models:
  - executableId: azure-openai
    name: gpt-4o

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
